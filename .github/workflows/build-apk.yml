name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/drag-drop-elementi-sezioni-rlk7fa

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      # Senza questo, ogni run genererebbe un debug.keystore nuovo e casuale (macchina effimera,
      # nessun keystore preesistente) — quindi un fingerprint SHA-1 diverso ad ogni build, che
      # rende impossibile registrarlo una volta sola su Google Cloud Console (vedi ci/debug.keystore
      # per i dettagli). Copiato nel percorso che questa versione di AGP/tooling usa di default su
      # questo runner (~/.config/.android/debug.keystore, verificato nei log di build precedenti).
      - name: Usa un debug.keystore fisso (fingerprint stabile tra le build)
        run: |
          mkdir -p ~/.config/.android
          cp ci/debug.keystore ~/.config/.android/debug.keystore

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Il download di un artifact di Actions serve da Azure Blob Storage (*.blob.core.windows.net),
      # dominio non raggiungibile dal proxy di rete della sessione che genera questo workflow —
      # stessa restrizione vista su dl.google.com per l'SDK Android. Il push su un branch dedicato
      # del repo resta scaricabile con un normale `git fetch`, che invece funziona.
      - name: Pubblica l'APK sul branch apk-artifacts
        run: |
          set -e
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK_PATH" /tmp/app-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fingerprint del certificato di firma usato per questo APK: la CI genera un debug.keystore
          # nuovo (non quello del computer dello sviluppatore), quindi SHA-1 diverso da build locali —
          # utile se questo APK va provato con feature che richiedono un fingerprint registrato
          # (es. Google Sign-In / OAuth client in Google Cloud Console per il backup su Drive).
          git checkout --orphan apk-artifacts
          git rm -rf . >/dev/null
          cp /tmp/app-debug.apk ./app-debug.apk
          {
            printf 'APK di debug generato dal commit %s (%s) il %s.\n\n' \
              "${{ github.sha }}" "${{ github.ref_name }}" "$(date -u +%FT%TZ)"
            echo "Fingerprint del certificato di firma debug usato da questa build CI:"
            echo '```'
            DEBUG_KEYSTORE=$(find "$HOME" -name debug.keystore 2>/dev/null | head -1)
            if [ -n "$DEBUG_KEYSTORE" ]; then
              echo "Keystore: $DEBUG_KEYSTORE"
              keytool -list -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -storepass android -keypass android \
                || echo "(errore nel leggere $DEBUG_KEYSTORE)"
            else
              echo "(nessun debug.keystore trovato sotto \$HOME)"
            fi
            echo '```'
          } > README.md
          git add app-debug.apk README.md
          git commit -m "apk: build da ${{ github.sha }}"
          git push --force origin HEAD:apk-artifacts
